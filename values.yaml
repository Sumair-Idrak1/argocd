apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-frontend
spec:
  serviceName: "frontend"   # Headless service for stable network IDs
  replicas: 3   # You can adjust this
  selector:
    matchLabels:
      app: my-frontend
  template:
    metadata:
      labels:
        app: my-frontend
    spec:
      containers:
      - name: my-frontend
        image: sumairjaved/my-frontend:087250ffad4302756c3c980382e81aad3e47ead3
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: data
          mountPath: /app/data   # directory inside container for persistent data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  clusterIP: None   # Headless service
  selector:
    app: my-frontend
  ports:
  - port: 5000
    targetPort: 5000

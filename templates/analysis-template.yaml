# analysis-template.yaml
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pod-health-check
spec:
  metrics:
  # This metric checks the Kubernetes resource (Rollout) status directly.
  # A successful run for 120 seconds means the pod has stabilized.
  # A common, simpler approach is to check for specific error events.
  - name: pod-errors
    interval: 10s
    failureLimit: 1 # Rollback immediately on the first failure
    successCondition: "{{ eq .result.status \"Stable\" }}" # Custom condition (hypothetical)
    provider:
      job:
        spec:
          # This job checks for pod status/logs. For a simpler, more direct check,
          # a Prometheus/Grafana query is usually preferred.
          # A simpler, built-in check is often preferred for basic pod stability.
          # Here we use a generic check that must be customized.
          # The key is checking if the Pods in the NEW ReplicaSet have been ready
          # and not restarting for the duration.
          # Since direct pod health check is complex in a generic AT, the best
          # practice is to query a monitoring system (e.g., Prometheus).
          pass: true # Replace with actual query based on your monitoring
          

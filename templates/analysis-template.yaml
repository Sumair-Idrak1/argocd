apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pod-stability-check
spec:
  # Define arguments that the Rollout can pass to this template
  args:
    - name: rollout-name
  metrics:
  - name: stable-for-2-minutes
    # 💡 The check will run every 15 seconds.
    interval: 15s
    # 💡 We want a minimum of 8 successful checks (15s * 8 = 120s = 2 minutes)
    consecutiveSuccessLimit: 8
    # 💡 If even one check fails, the analysis fails immediately, triggering a rollback.
    failureLimit: 1
    
    # 📝 Metric to check for CrashLoopBackOff or other error state
    provider:
      prometheus:
        # NOTE: This query requires kube-state-metrics to be installed.
        # It checks if any container of the new Rollout ReplicaSet (identified by the argument)
        # is currently in a waiting state with reason 'CrashLoopBackOff'.
        # The value will be 1 if a pod is crashing, 0 otherwise.
        query: |
          sum(kube_pod_container_status_waiting_reason{
            namespace="{{ .AnalysisRun.Namespace }}",
            pod=~"{{ args.rollout-name }}.*",
            reason="CrashLoopBackOff"
          })
          
    # 💡 Success Condition: The query result must be exactly 0 (no pods are in CrashLoopBackOff).
    successCondition: "{{ eq .value 0 }}"

  - name: pod-ready-check
    interval: 15s
    consecutiveSuccessLimit: 8 # Also requires 2 minutes (8 * 15s) of pod readiness
    failureLimit: 1
    
    provider:
      prometheus:
        # Checks if the number of ready containers for the new ReplicaSet
        # is less than the number of total containers. A value > 0 means
        # not all containers are ready. We want 0.
        query: |
          sum(kube_pod_container_status_ready{
            namespace="{{ .AnalysisRun.Namespace }}",
            pod=~"{{ args.rollout-name }}.*",
            container_ready="false"
          })
          
    # 💡 Success Condition: The query result must be exactly 0 (all containers are ready).
    successCondition: "{{ eq .value 0 }}"

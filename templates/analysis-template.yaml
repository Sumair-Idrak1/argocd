apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: pod-stability-check
spec:
  # Defines the variable that the Rollout will supply (the Rollout's name)
  args:
    - name: rollout-name
  metrics:
  
  # Metric 1: Check for CrashLoopBackOff/Error State
  - name: stable-for-2-minutes
    # Run the check every 15 seconds.
    interval: 15s
    # Requires 8 consecutive successful checks (15s * 8 = 120s = 2 minutes).
    consecutiveSuccessLimit: 8
    # Rollback immediately on the first failure.
    failureLimit: 1
    
    provider:
      prometheus:
        # Query Prometheus for pods matching the Rollout name that are in CrashLoopBackOff
        query: |
          sum(kube_pod_container_status_waiting_reason{
            namespace="{{ .AnalysisRun.Namespace }}",
            # CORRECTLY reference the argument with the leading dot: .args.rollout-name
            pod=~"{{ .args.rollout-name }}.*",
            reason="CrashLoopBackOff"
          })
          
    # Success Condition: The value must be 0 (i.e., no pods in CrashLoopBackOff).
    successCondition: "{{ eq .value 0 }}"

  # Metric 2: Check for General Pod Readiness
  - name: pod-ready-check
    interval: 15s
    consecutiveSuccessLimit: 8 # Requires 2 minutes of continuous pod readiness
    failureLimit: 1
    
    provider:
      prometheus:
        # Check for any container that is NOT ready (container_ready="false")
        query: |
          sum(kube_pod_container_status_ready{
            namespace="{{ .AnalysisRun.Namespace }}",
            # CORRECTLY reference the argument with the leading dot: .args.rollout-name
            pod=~"{{ .args.rollout-name }}.*",
            container_ready="false"
          })
          
    # Success Condition: The value must be 0 (i.e., all required containers are ready).
    successCondition: "{{ eq .value 0 }}"

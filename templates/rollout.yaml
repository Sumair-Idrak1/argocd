apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: deployedfrontend-deployedfrontend
  namespace: deployedfrontend
  labels:
    app.kubernetes.io/instance: deployedfrontend
    app.kubernetes.io/name: deployedfrontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/instance: deployedfrontend
      app.kubernetes.io/name: deployedfrontend
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      canaryService: deployedfrontend-canary
      stableService: deployedfrontend-stable
      steps:
        - setWeight: 20
        - pause: { duration: 20 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 100
        - pause: { duration: 10 }
      abortScaleDownDelaySeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: deployedfrontend
        app.kubernetes.io/name: deployedfrontend
    spec:
      containers:
        - name: deployedfrontend
          image: sumairjaved/my-frontend:dd19ef683c7557a94fd62216ac152a515e7ef305
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
            successThreshold: 1
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
            timeoutSeconds: 3

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: deployedfrontend-deployedfrontend
  namespace: deployedfrontend
  labels:
    app.kubernetes.io/instance: deployedfrontend
    app.kubernetes.io/name: deployedfrontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app.kubernetes.io/instance: deployedfrontend
      app.kubernetes.io/name: deployedfrontend
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: { duration: 20 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 100
        - pause: { duration: 10 }
      abortScaleDownDelaySeconds: 30
      analysis:
        startingStep: 1
        templates:
          - templateName: deployedfrontend-health-check
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: deployedfrontend
        app.kubernetes.io/name: deployedfrontend
    spec:
      containers:
        - name: deployedfrontend
          image: sumairjaved/my-frontend:dd19ef683c7557a94fd62216ac152a515e7ef305
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: deployedfrontend-health-check
  namespace: deployedfrontend
spec:
  metrics:
    - name: pod-health
      initialDelay: 10s
      interval: 10s
      count: 5
      successCondition: result == "true"
      failureLimit: 2
      provider:
        job:
          spec:
            backoffLimit: 0
            template:
              spec:
                containers:
                  - name: health-check
                    image: bitnami/kubectl:latest
                    command:
                      - sh
                      - -c
                      - |
                        # Check if all pods are ready
                        READY=$(kubectl get pods -n deployedfrontend -l app.kubernetes.io/name=deployedfrontend -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -o "True" | wc -l)
                        TOTAL=$(kubectl get pods -n deployedfrontend -l app.kubernetes.io/name=deployedfrontend --no-headers | wc -l)
                        
                        if [ "$READY" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
                          echo "true"
                        else
                          echo "false"
                          exit 1
                        fi
                restartPolicy: Never

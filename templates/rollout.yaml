apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: deployedfrontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60     # Wait 2 minutes max for progress
  selector:
    matchLabels:
      app: deployedfrontend
  strategy:
    canary:
      progressDeadlineAbort: true   # <-- must be inside canary
      abortScaleDownDelaySeconds: 0
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: { duration: 30 }
        - setWeight: 50
        - pause: { duration: 60 }
  template:
    metadata:
      labels:
        app: deployedfrontend
    spec:
      containers:
        - name: deployedfrontend
          image: nginx:broken          # simulate crash
          ports:
            - containerPort: 80

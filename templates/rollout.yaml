apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}
  strategy:
    blueGreen:
      activeService: deployedfrontend-active          # current stable service
      previewService: deployedfrontend-preview        # new version before promotion
      autoPromotionEnabled: false                     # manual or metric-based promotion
      autoPromotionSeconds: 0                         # set >0 for timed promotion
      scaleDownDelaySeconds: 30                       # wait before deleting old pods
      abortScaleDownDelaySeconds: 10                  # keep stable if new fails
  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

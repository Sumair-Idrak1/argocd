apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 10 }  # Observe at 20%
        - setWeight: 50
        - pause: { duration: 20 }  # Observe at 50%

      # Abort rollout if pods fail to become Ready in time
      progressDeadlineSeconds: 60
      progressDeadlineAbort: true
      abortScaleDownDelaySeconds: 0
      maxUnavailable: 0
      maxSurge: 1

      # Retry logic
      retryStrategy:
        limit: 2
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 60s

  revisionHistoryLimit: 5

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

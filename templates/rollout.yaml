apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5

  # Wait up to 60s for pods to become ready before declaring failure
  progressDeadlineSeconds: 60

  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}

  strategy:
    canary:
      # 🚦 Canary deployment with automatic rollback on failure
      progressDeadlineAbort: true         # Abort rollout automatically when deadline exceeded
      abortScaleDownDelaySeconds: 0       # Immediately scale down failed ReplicaSets
      maxSurge: 1                         # Allow one extra pod during update
      maxUnavailable: 0                   # Never take down running pods during rollout

      steps:
        - setWeight: 20                   # Send 20% of traffic to the new version
        - pause: { duration: 20 }         # Wait to ensure new pods are healthy
        - setWeight: 50                   # Increase traffic to 50%
        - pause: { duration: 30 }         # Wait again before promoting
        - setWeight: 100                  # Move 100% traffic to new version
        - pause: { duration: 10 }         # Final check before full promotion

      # ♻️ Retry strategy for transient failures
      retryStrategy:
        limit: 2
        backoff:
          duration: 10s
          factor: 2
          maxDuration: 30s

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.port }}

          # 🩺 Health checks
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

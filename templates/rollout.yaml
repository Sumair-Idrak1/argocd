apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # 🧠 Canary steps: gradually shift traffic and pause for observation
      steps:
        - setWeight: 20
        
        # 💡 STEP 1: Introduce new code and immediately run a 2-minute health check.
        # This will block the rollout until the analysis is successful (2 min stable) or fails (rollback).
        - analysis:
            templates:
            # References the template defined below (pod-stability-check)
            - templateName: pod-stability-check
            args:
            - name: rollout-name
              # Passes the base name of the Rollout, which is used as the pod prefix 
              # to scope the Prometheus query to the new ReplicaSet's pods.
              value: {{ include "deployedfrontend.fullname" . }}
            
        - pause: { duration: 30s } # Short pause after initial health check
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100 # Final promotion to full traffic

      # ✅ Auto rollback configuration
      progressDeadlineAbort: true
      abortScaleDownDelaySeconds: 10
      abortScaleDownDelayAbort: true

      # 🚀 Automatically revert to last stable version on failure
      rollbackTo:
        revision: 0 # 0 = revert to last stable ReplicaSet

      # Optional: define traffic routing services (recommended for production)
      # stableService: deployedfrontend-stable
      # canaryService: deployedfrontend-canary

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

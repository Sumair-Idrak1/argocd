apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # 🧠 Canary steps: gradually shift traffic and pause for observation
      steps:
        - setWeight: 20
        - pause: { duration: 30 }
        - setWeight: 50
        - pause: { duration: 60 }

      # ✅ Auto rollback configuration
      progressDeadlineSeconds: 120          # Wait up to 2 min for pods to stabilize
      progressDeadlineAbort: true           # Abort rollout if deadline exceeded
      abortScaleDownDelaySeconds: 10        # Wait 10s before cleaning up bad ReplicaSet
      abortScaleDownDelayAbort: true        # Immediately scale up stable RS on abort

      # 🚀 Automatically revert to last stable version
      rollbackTo:
        revision: 0                         # 0 = revert to last stable ReplicaSet

      # Optional: define traffic routing services (recommended for production)
      # stableService: deployedfrontend-stable
      # canaryService: deployedfrontend-canary

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

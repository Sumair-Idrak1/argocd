apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5

  # ✅ Place this at the top-level (spec), not under canary
  progressDeadlineSeconds: 60 # Wait max 2 minutes for pods to become Ready

  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}

  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: { duration: 30 }  # Observe for 30s
        - setWeight: 50
        - pause: { duration: 60 }  # Observe for 1 min
      progressDeadlineAbort: true
      abortScaleDownDelaySeconds: 0
      maxSurge: 1
      maxUnavailable: 0
      retryStrategy:
        limit: 1
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 60s

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

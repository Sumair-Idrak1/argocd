apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}

  strategy:
    canary:
      # Canary rollout steps — gradual traffic shift with pauses
      steps:
        - setWeight: 20
        - pause: { duration: 30 }   # Observe at 20%
        - setWeight: 50
        - pause: { duration: 60 }   # Observe at 50%

      # Automatic rollback + retry logic
      progressDeadlineSeconds: 30          # Wait 2 minutes for pods to stabilize
      progressDeadlineAbort: true           # Abort rollout if deadline exceeded
      abortScaleDownDelaySeconds: 10        # Wait before cleaning up bad ReplicaSet
      abortScaleDownDelayAbort: true        # Immediately restore stable RS
      maxUnavailable: 0                     # Never take down all pods
      maxSurge: 1                           # Add one extra pod during update

      # Retry rollout if it fails once — terminate after second failure
      retryStrategy:
        limit: 2                            # Retry rollout only 2 times
        backoff:
          duration: 30s                     # Wait 30s before retrying
          factor: 2                         # Exponential backoff multiplier
          maxDuration: 120s                 # Max wait time between retries

      # Optional: Stable/Canary routing
      # stableService: deployedfrontend-stable
      # canaryService: deployedfrontend-canary

  revisionHistoryLimit: 5                   # Keep 5 revisions for rollback

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}

          # Health checks detect CrashLoopBackOff early
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

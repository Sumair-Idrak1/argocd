apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}

  strategy:
    canary:
      # Canary steps
      steps:
        - setWeight: 20
        - pause: { duration: 10 }   # Observe for 30s
        - setWeight: 50
        - pause: { duration: 20 }   # Observe for 1 min before progressing

      # If rollout doesn’t progress (pods not Ready)
      progressDeadlineSeconds: 40   # Wait 2 minutes max for pod readiness
      progressDeadlineAbort: true    # Abort automatically if deadline exceeded

      # Don’t leave failed replicas running
      abortScaleDownDelaySeconds: 0

      # Pod surge settings (optional but recommended)
      maxSurge: 1
      maxUnavailable: 0

      # Retry strategy in case of failure
      retryStrategy:
        limit: 1
        backoff:
          duration: 10s
          factor: 2
          maxDuration: 20s

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

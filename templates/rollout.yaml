apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "deployedfrontend.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      # 🧠 Canary steps: gradually shift traffic and pause for observation
      steps:
        - setWeight: 20
        # 💡 NEW: Analysis step to check the new pod's health for 2 minutes (120s)
        - analysis:
            templates:
            # You must create an AnalysisTemplate named 'pod-health-check'
            - templateName: pod-health-check
            # The failureLimit controls how many times the analysis can fail before rollback
            # Since you want to check for 2 minutes, the AnalysisTemplate should
            # define a duration and an interval for its metric checks.
            # However, you can use the analysis step's built-in support for a minimum duration.
            # A simpler way to enforce a minimum *successful* run time is often
            # defined within the AnalysisTemplate itself using a combination of
            # `interval` and `count`.
            # For simplicity here, we rely on the analysis template to check
            # pod status or a success metric multiple times over the period.
            
        - pause: { duration: 30s } # Short pause after initial health check
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100 # Final promotion to full traffic

      # ✅ Auto rollback configuration
      # The analysis step will automatically trigger a rollback on a failed result.
      # progressDeadlineSeconds: 120 # Replaced by health check logic
      progressDeadlineAbort: true
      abortScaleDownDelaySeconds: 10
      abortScaleDownDelayAbort: true

      # 🚀 Automatically revert to last stable version
      rollbackTo:
        revision: 0 # 0 = revert to last stable ReplicaSet

      # Optional: define traffic routing services (recommended for production)
      # stableService: deployedfrontend-stable
      # canaryService: deployedfrontend-canary

  template:
    metadata:
      labels:
        {{- include "deployedfrontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

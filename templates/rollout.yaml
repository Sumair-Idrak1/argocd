apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: deployedfrontend-deployedfrontend
  namespace: deployedfrontend
  labels:
    app.kubernetes.io/instance: deployedfrontend
    app.kubernetes.io/name: deployedfrontend
spec:
  replicas: 1
  revisionHistoryLimit: 5

  # maximum time to wait for new pods to become Ready before considering progress failed
  progressDeadlineSeconds: 60

  selector:
    matchLabels:
      app.kubernetes.io/instance: deployedfrontend
      app.kubernetes.io/name: deployedfrontend

  strategy:
    canary:
      # Automatically abort the rollout when the progress deadline is exceeded
      progressDeadlineAbort: true

      # when aborting, scale down the failed RS immediately
      abortScaleDownDelaySeconds: 0

      maxSurge: 1
      maxUnavailable: 0

      steps:
        - setWeight: 20
        - pause: { duration: 20 }
        - setWeight: 50
        - pause: { duration: 30 }
        - setWeight: 100
        - pause: { duration: 10 }

      # retryStrategy:
      #   limit: 2
      #   backoff:
      #     duration: 10s
      #     factor: 2
      #     maxDuration: 30s

  template:
    metadata:
      labels:
        app.kubernetes.io/instance: deployedfrontend
        app.kubernetes.io/name: deployedfrontend
    spec:
      containers:
        - name: deployedfrontend
          image: sumairjaved/my-frontend:dd19ef683c7557a94fd62216ac152a515e7ef305
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

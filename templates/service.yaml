apiVersion: v1
kind: Service
metadata:
  name: {{ include "deployedfrontend.fullname" . }}
  labels:
    {{- include "deployedfrontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "deployedfrontend.selectorLabels" . | nindent 4 }}
